name: PrompTTY
options:
  bundleIdPrefix: dev.promptty
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  PrompTTYCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Apple silicon only: no Intel slice, in Debug or Release.
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
targets:
  PrompTTYApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/PrompTTYApp
        excludes:
          - Info.plist
    info:
      path: Sources/PrompTTYApp/Info.plist
      properties:
        # Without these the built app has no version, and the Dock keeps showing whatever icon
        # it cached first for the bundle ID (the generic one, from before the icon existed).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Folders opened with `open -a PrompTTY DIR` or dropped on the Dock icon open in a tab
        # (AppDelegate.application(_:open:)); Alternate, so Finder still opens folders itself.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
        # In-app drag payloads (tabs, panes and projects); see Chrome/DragSupport.swift.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.promptty.pane
            UTTypeDescription: PrompTTY Pane
            UTTypeConformsTo: [public.data]
          - UTTypeIdentifier: dev.promptty.tab
            UTTypeDescription: PrompTTY Tab
            UTTypeConformsTo: [public.data]
          - UTTypeIdentifier: dev.promptty.project
            UTTypeDescription: PrompTTY Project
            UTTypeConformsTo: [public.data]
    dependencies:
      - package: PrompTTYCore
        product: WorkspaceModel
      - package: PrompTTYCore
        product: GhosttyBridge
      - package: PrompTTYCore
        product: Preferences
      - package: PrompTTYCore
        product: CommandEditing
      - package: PrompTTYCore
        product: PaneActivity
      - package: PrompTTYCore
        product: CommandBlocks
      - package: PrompTTYCore
        product: AgentHooks
      - package: PrompTTYCore
        product: RemoteControl
      - package: PrompTTYCore
        product: PrompTTYChrome
      - package: PrompTTYCore
        product: RemoteServer
      # `promptty`, put on every pane's PATH: in Resources/bin, not beside the app's own binary,
      # which on a case-insensitive disk it would clash with.
      - target: promptty-cli
        embed: true
        codeSign: true
        copy:
          destination: resources
          subpath: bin
      # The hook helper, in Contents/MacOS beside the app (Claude Code's settings point at it).
      - target: promptty-hook
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: PrompTTY
        PRODUCT_BUNDLE_IDENTIFIER: dev.promptty.PrompTTY2
        MARKETING_VERSION: "2.1"
        # script/run and script/test pass the git commit count, so each commit gets a new build
        # number and macOS refreshes cached icons.
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
      # Release builds are for distribution (script/release): signed with the Developer ID, with
      # the hardened runtime and a secure timestamp that notarization requires. Only this target:
      # the Swift packages' resource bundles sign themselves. Debug stays ad hoc, needing no key.
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: RQ2CW4W282
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  # Run by Claude Code's hooks inside a pane (Sources/promptty-hook); also a SwiftPM executable for
  # the tests.
  promptty-hook:
    type: tool
    platform: macOS
    sources:
      - path: Sources/promptty-hook
    dependencies:
      - package: PrompTTYCore
        product: AgentHooks
    settings:
      base:
        PRODUCT_NAME: promptty-hook
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: RQ2CW4W282
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  # `promptty` (Sources/promptty): control the app from its own terminals.
  promptty-cli:
    type: tool
    platform: macOS
    sources:
      - path: Sources/promptty
    dependencies:
      - package: PrompTTYCore
        product: RemoteControl
    settings:
      base:
        PRODUCT_NAME: promptty
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: RQ2CW4W282
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  # PrompTTY for iPhone and iPhone Duo (iOS/): for now on demo data; built from the shared packages.
  PrompTTYPhone:
    type: application
    platform: iOS
    sources:
      - path: iOS/PrompTTYPhone
        excludes:
          - Info.plist
    dependencies:
      - package: PrompTTYCore
        product: PrompTTYChrome
      - package: PrompTTYCore
        product: PaneActivity
      - package: PrompTTYCore
        product: Preferences
      - package: PrompTTYCore
        product: RemoteClient
      - package: PrompTTYCore
        product: RemoteProtocol
      - package: PrompTTYCore
        product: RemoteControl
    settings:
      base:
        PRODUCT_NAME: PrompTTY
        PRODUCT_BUNDLE_IDENTIFIER: dev.promptty.PrompTTY2.phone
        # A Mac's PrompTTY is reached over Tailscale by plain ws://: the tailnet encrypts it.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "PrompTTY connects to PrompTTY on your Macs."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "PrompTTY asks for Face ID before showing a Mac's terminals."
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: iOS/PrompTTYPhone/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
  PrompTTYPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iOS/PrompTTYPhoneUITests
    dependencies:
      - target: PrompTTYPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.promptty.PrompTTY2.phone.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PrompTTYPhone
schemes:
  PrompTTYApp:
    build:
      targets:
        PrompTTYApp: all
    run:
      config: Debug
  PrompTTYPhone:
    build:
      targets:
        PrompTTYPhone: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PrompTTYPhoneUITests
