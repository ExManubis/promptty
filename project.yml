name: PrompTTY
options:
  bundleIdPrefix: dev.promptty
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  PrompTTYCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
targets:
  PrompTTYApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/PrompTTYApp
        excludes:
          - Info.plist
    info:
      path: Sources/PrompTTYApp/Info.plist
      properties:
        # Without these the built app has no version, and the Dock keeps showing whatever icon
        # it cached first for the bundle ID (the generic one, from before the icon existed).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # In-app drag payloads (tabs and panes); see Chrome/DragSupport.swift.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.promptty.pane
            UTTypeDescription: PrompTTY Pane
            UTTypeConformsTo: [public.data]
          - UTTypeIdentifier: dev.promptty.tab
            UTTypeDescription: PrompTTY Tab
            UTTypeConformsTo: [public.data]
    dependencies:
      - package: PrompTTYCore
        product: WorkspaceModel
      - package: PrompTTYCore
        product: GhosttyBridge
      - package: PrompTTYCore
        product: Preferences
      - package: PrompTTYCore
        product: CommandEditing
      - package: PrompTTYCore
        product: PaneActivity
    settings:
      base:
        PRODUCT_NAME: PrompTTY
        PRODUCT_BUNDLE_IDENTIFIER: dev.promptty.PrompTTY2
        MARKETING_VERSION: "0.2.0"
        # script/run and script/test pass the git commit count, so each commit gets a new build
        # number and macOS refreshes cached icons.
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
schemes:
  PrompTTYApp:
    build:
      targets:
        PrompTTYApp: all
    run:
      config: Debug
